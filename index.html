<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><title>MOTIONX</title><link rel="stylesheet" href="css/style.css"></head><body><div class="shell"><header><div class="brand"><b>M</b><span id="brand">MOTIONX</span></div><button id="settings">⚙ Settings</button></header><div class="layout"><aside><h4>LIBRARY</h4><nav id="nav"></nav><button id="addCat">＋ New category</button></aside><main><div class="heading"><div><small>YOUR MOTION LIBRARY</small><h1 id="title">Transitions</h1></div><button class="primary" id="import">＋ Import preset</button></div><input id="search" placeholder="Search presets…"><div id="cards"></div><section class="editor"><h3 id="selected">Select a preset</h3><label>Intensity <output id="iv">100%</output></label><input id="intensity" type="range" min="0" max="200" value="100"><label>Duration <output id="dv">1.0 s</output></label><input id="duration" type="range" min="10" max="500" value="100"><div class="curve"><label>Motion curve</label><select id="curve"><option value="ease">Ease In-Out</option><option value="linear">Linear</option><option value="easeIn">Ease In</option><option value="easeOut">Ease Out</option></select></div><canvas id="graph" width="420" height="100"></canvas><button class="primary" id="apply" disabled>Apply to selected layer</button><p class="note">Intensity, duration and curve controls require preset-specific adapters to alter arbitrary .ffx animation safely.</p></section></main></div></div><div id="modal" class="modal hidden"><div class="dialog"><button id="close">✕</button><h3>Settings</h3><label>Theme</label><select id="theme"><option value="blue">MOTIONX Blue</option><option value="violet">Violet</option><option value="emerald">Emerald</option><option value="mono">Monochrome</option></select><label>Plugin name</label><input id="brandInput" value="MOTIONX"><button class="primary" id="save">Save</button></div></div><script src="js/bridge.js"></script><script src="js/app.js"></script></body></html>
